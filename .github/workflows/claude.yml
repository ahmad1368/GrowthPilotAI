name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # دسترسی نوشتن برای کامیت کردن مستقیم کدهای اصلاح شده توسط کلود
      pull-requests: write # دسترسی برای ثبت کامنت روی PRها
      issues: write # دسترسی برای پاسخ دادن به ایشوها
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          additional_permissions: |
            actions: read

          # آرگومان و تمامی مجوزهای استخراج شده بر اساس نیازمندی‌های پروژه شما:
          claude_args: >-
            --allowed-tools "Bash(npm:*),Bash(npx:*),Bash(flutter:*),Bash(dart:*),Bash(sqlite3:*),mcp__playwright__navigate,mcp__playwright__click,mcp__playwright__fill,mcp__playwright__hover,mcp__playwright__select_option,mcp__playwright__get_html,mcp__playwright__screenshot"
