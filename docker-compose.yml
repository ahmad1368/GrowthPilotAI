# Issue #182. Only one real service exists to orchestrate here — no
# NestJS API, MongoDB, or Redis in this repo (see Dockerfile comment).
# No secrets/env vars are needed: this serves a static Flutter web
# build, nothing here talks to a database or holds a credential.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
