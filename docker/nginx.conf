# Issue #182. Serves the compiled Flutter web build (client-side routed
# by GetX's GetMaterialApp) — unknown paths fall back to index.html
# instead of a 404, same as any single-page-app deployment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter's build output fingerprints these, so they're safe to
    # cache aggressively; index.html itself is deliberately excluded
    # so a new deploy is picked up immediately.
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
